<!doctype html><html><head><title>03 Flex</title><style>
body{margin:0} .row{display:flex; gap:12px; padding:10px; background-color:#eef0f4}
.cell{background-color:#1a56db; color:#fff; padding:6px}
.spacer{flex-grow:1}
.col{display:flex; flex-direction:column; gap:8px; padding:10px}
</style></head><body>
<div class="row"><span class="cell">A</span><span class="cell">B</span><span class="spacer"></span><span class="cell">Fim</span></div>
<div class="col"><div class="cell">1</div><div class="cell">2</div></div>
</body></html>
