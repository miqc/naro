<!doctype html><html><head><title>24 Unidades</title><style>
html { font-size: 20px }
body { margin: 0; font-size: 16px }
section { width: calc(100% - 200px); height: 4px; background-color: #0a7d3f }
article { width: min(800px, 50%); height: 4px; background-color: #8a1f1f }
aside { width: clamp(300px, 80vw, 500px); height: 4px; background-color: #681da8 }
nav { width: 50vw; height: 4px; background-color: #1558d6 }
main { height: 10vh; background-color: #0e7490 }
header { height: 2rem; background-color: #b45309 }
footer { padding: 1rem; margin: 2em 0 0 0; background-color: #eeeeee }
.card { width: calc(50vw - 100px); height: calc(2 * 5px); background-color: #334155 }
</style></head><body>
<section>largura calculada</section>
<article>largura minima</article>
<aside>largura limitada</aside>
<nav>metade da viewport</nav>
<main></main>
<header></header>
<div class="card">cartao</div>
<footer>rodape com rem</footer>
</body></html>
