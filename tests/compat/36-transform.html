<!doctype html>
<html><head><title>36 Transform</title><style>
/* The canvas paints white first, and the body box is deliberately transparent:
   NARO paints an absolutely positioned child before its ancestor's box, so a
   white body would cover every sample below. Pre-existing paint-order
   limitation, registered in reports/milestone-v0.3.md — not what this page
   tests. */
body { margin: 0; background-color: transparent; }
div, a { position: absolute; }
#t { left: 0; top: 0; width: 100px; height: 100px; background: #ff0000;
     transform: translate(200px, 0); }
#r { left: 0; top: 200px; width: 40px; height: 20px; background: #0000ff;
     transform: rotate(90deg); transform-origin: center; }
#of { object-fit: contain; }
#lk { left: 0; top: 300px; width: 60px; height: 20px; display: block;
      transform: translate(400px, 0); background: #ffff00; }
</style></head><body>
<div id="t"></div>
<div id="r"></div>
<img id="of" src="assets/red.png" width="100" height="100"
     style="position:absolute;left:300px;top:0">
<a id="lk" href="36-transform.html">ir</a>
<script>
const cs = (id) => getComputedStyle(document.getElementById(id));
console.log("t.box=" + document.getElementById("t").offsetWidth + "x" + document.getElementById("t").offsetHeight);
console.log("of.fit=" + cs("of").objectFit);
</script></body></html>
