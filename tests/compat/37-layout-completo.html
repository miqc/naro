<!doctype html>
<html><head><title>37 Layout completo</title><style>
body { margin: 0; font-size: 16px; }
div { box-sizing: border-box; }

/* float + clear */
#fl { float: left; width: 200px; height: 60px; background: #ff0000; }
#fr { float: right; width: 100px; height: 40px; background: #0000ff; }
#ft { margin: 0; }
#cl { clear: both; height: 20px; background: #00ff00; }

/* vertical-align */
#vb { margin: 0; font-size: 20px; height: 40px; }
#vm { display: inline-block; width: 20px; height: 20px; background: #ff00ff;
      vertical-align: middle; }
#vt { display: inline-block; width: 20px; height: 10px; background: #00ffff;
      vertical-align: top; }

/* order */
#of { display: flex; width: 300px; height: 30px; }
#oa { order: 2; width: 100px; height: 30px; background: #ffaa00; }
#ob { order: 1; width: 100px; height: 30px; background: #00aa00; }

/* grid-area */
#ga { display: grid; width: 300px; height: 60px; grid-template-columns: 100px 100px; }
#g1 { grid-area: 1 / 1 / 3 / 2; background: #8a1f1f; }

/* border-collapse */
#t { border-collapse: collapse; }
#t td { border: 2px solid #000000; width: 50px; height: 20px; padding: 0; }
</style></head><body>

<div id="fl"></div>
<div id="fr"></div>
<p id="ft">texto ao lado dos dois flutuantes</p>
<div id="cl"></div>

<p id="vb">base <span id="vm"></span><span id="vt"></span></p>

<div id="of"><div id="oa"></div><div id="ob"></div></div>

<div id="ga"><div id="g1"></div></div>

<table id="t"><tr><td>a</td><td>b</td></tr></table>

<script>
const cs = (id) => getComputedStyle(document.getElementById(id));
console.log("fl=" + cs("fl").float);
console.log("cl=" + cs("cl").clear);
console.log("oa=" + cs("oa").order);
console.log("vb=" + document.getElementById("vm").offsetTop);
</script></body></html>
